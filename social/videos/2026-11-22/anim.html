<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}

</style></head><body>
<div id="stage"></div>
<div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 10 11l4 4 6-8"/></svg></span>FTM</div>
<div id="bar"></div>
<div id="cap"><div class="w" id="subw"></div></div>
<script src="rig.js"></script><script>
const W=1080,H=1920,sin=Math.sin,cos=Math.cos,PI=Math.PI;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)},back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const IMG=(src,t,o)=>{o=o||{};const z=(o.z0||1)+(o.dz||0.08)*cl(t/(o.d||6)),x=(o.x||0)+(o.dx||0)*cl(t/(o.d||6)),y=(o.y||0)+(o.dy||0)*cl(t/(o.d||6));return `<img class="ph" src="${src}" style="transform:translate(${x}px,${y}px) scale(${z});filter:${o.f||'none'}">`};
const SHADE=(a,b)=>`<div class="shade" style="background:linear-gradient(180deg,rgba(5,9,31,${a}) 0%,rgba(5,9,31,${a*0.35}) 30%,rgba(5,9,31,${a*0.4}) 55%,rgba(5,9,31,${b}) 100%)"></div>`;
const LOGO=(s)=>`<svg viewBox="0 0 120 120" width="${s}" height="${s}"><rect width="120" height="120" rx="35" fill="#1F3A93"/><path d="M30 85 L55 57 L72 73 L96 41" stroke="#D4AF37" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/* Nov 22: "Does FTM rest at the weekend?" Real figures: Portfolio backtest (data/trades/all/100000/g2, trades held over a weekend) + live account 14 Nov. */
const MAYA={skin:'#c68642',hair:'#1b120c',hairStyle:'curly',top:'#7a3fb0',ph:.2};
const SAM={skin:'#f1c27d',hair:'#6b4423',hairStyle:'short',top:'#2a6fb0',beard:1,ph:.9};
const LENA={skin:'#ffdbac',hair:'#b5562b',hairStyle:'long',top:'#d9705a',ph:1.6};
const DEV={skin:'#8d5524',hair:'#141414',hairStyle:'short',top:'#2fa37a',glasses:1,ph:2.1};
const ZOE={skin:'#e0ac69',hair:'#2b1810',hairStyle:'bun',top:'#E3B62F',top2:'#b8901f',ph:.6};
const P=(b,o)=>person(Object.assign({},b,o));
const open_=(bg)=>`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="position:absolute;inset:0">${bg||''}`;
const grad=(id,a,b)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`;
const TX=(x,y,s,c,txt,w,o)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Inter" font-weight="${w||900}" font-size="${s}" fill="${c}" opacity="${o==null?1:o}">${txt}</text>`;
function stars(t,n){let s='';for(let i=0;i<(n||60);i++){const x=(i*173)%W,y=(i*97)%1250+40;s+=`<circle cx="${x}" cy="${y}" r="${1.5+(i%3)}" fill="#fff" opacity="${.25+.35*(.5+.5*sin(t*2+i))}"/>`}return s}
function moon(x,y,r){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#f6e7b0"/><circle cx="${x+r*.45}" cy="${y-r*.2}" r="${r*.9}" fill="#0b1640"/>`}
function stamp(t,label,col,y){const p=back(t/0.3);return `<g transform="translate(540,${y||1040}) rotate(-8) scale(${1.8-0.8*p})" opacity="${cl(t/0.12)}"><rect x="-230" y="-70" width="460" height="140" rx="18" fill="rgba(5,10,34,.6)" stroke="${col}" stroke-width="12"/>${TX(0,38,108,col,label)}</g>`}
function count(t,a,b,dec){const v=a+(b-a)*ease(t);return v.toLocaleString('en-US',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0})}
function flash(t){return t<0.18?`<rect width="${W}" height="${H}" fill="#fff" opacity="${0.5*(1-t/0.18)}"/>`:''}

const KAI={skin:'#a86b3c',hair:'#0f0f0f',hairStyle:'short',top:'#E5323E',ph:1.1};
function machine(t,y){const n=24;let d='';for(let i=0;i<n;i++){const x=i*7,yy=18-i*0.9+5*sin(i*0.9+t*3);d+=(i?' L':'M')+x+' '+yy}
 return `<g transform="translate(540,${y||360})"><rect x="-350" y="-40" width="700" height="80" rx="40" fill="rgba(5,10,34,.78)" stroke="rgba(47,191,113,.7)" stroke-width="3"/><circle cx="-310" cy="0" r="${9+3*sin(t*6)}" fill="#2fbf71"/><text x="-288" y="11" font-family="Inter" font-weight="800" font-size="30" fill="#fff">FTM MACHINE <tspan fill="#2fbf71">· in the market</tspan></text><g transform="translate(180,-12)"><path d="${d}" stroke="#2fbf71" stroke-width="4" fill="none"/></g></g>`}
function tag(t,txt,y,col){const a=back(t/0.4);return `<g transform="translate(540,${y}) scale(${a})"><rect x="-300" y="-46" width="600" height="92" rx="46" fill="${col||'#E3B62F'}"/>${TX(0,16,44,'#0b1640',txt)}</g>`}
function beams(t){let b='';const C=['#E5323E','#E3B62F','#7fe3ff','#b07cff','#2fbf71'];for(let i=0;i<5;i++){const a=-30+60*(.5+.5*sin(t*1.6+i*1.3));b+=`<path d="M${180+i*180} 430 L${180+i*180+Math.tan(a*PI/180)*900-120} 1330 L${180+i*180+Math.tan(a*PI/180)*900+120} 1330 Z" fill="${C[i]}" opacity=".16"/>`}return b}
function ballSvg(x,y,r){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><path d="M${x-r} ${y} Q${x} ${y-r*.5} ${x+r} ${y} M${x} ${y-r} Q${x+r*.5} ${y} ${x} ${y+r}" stroke="#0b1640" stroke-width="5" fill="none"/>`}

const WK=n=>'../assets/wk/wk'+n+'.jpg';
function photo(n,t,o){return IMG(WK(n),t,Object.assign({z0:1.04,dz:0.1,d:5},o||{}))+SHADE(.55,.85)}
function xfade(t,d,list){const k=list.length,seg=d/k;let h='';list.forEach((n,i)=>{const lt=t-i*seg,a=i==0?1:cl(lt/0.35);if(lt>-0.4)h+=`<div style="position:absolute;inset:0;opacity:${a}">${photo(n,Math.max(0,lt),{dx:i%2?-30:30})}</div>`});return h}
const SCN={
 hookOld(t){
  const days=['MON','TUE','WED','THU','FRI','SAT','SUN'];let cal='';
  days.forEach((d,i)=>{const we=i>4,a=ease((t-i*0.07)/0.4),x=90+i*130;cal+=`<g opacity="${a}" transform="translate(${x},${430+(1-a)*40})"><rect x="0" y="0" width="112" height="128" rx="20" fill="${we?'rgba(212,175,55,.18)':'rgba(255,255,255,.08)'}" stroke="${we?'#D4AF37':'rgba(255,255,255,.2)'}" stroke-width="${we?4:2}"/>${TX(56,52,30,we?'#E3B62F':'#c9d0ee',d,800)}${we?TX(56,104,40,'#E3B62F','?'):TX(56,104,36,'#2fbf71','✓')}</g>`});
  const zz=[0,1,2].map(i=>{const k=(t*0.8+i/3)%1;return TX(-200+k*0,-200,40+k*30,'#c9d0ee','z',900,1-k)}).join('');
  const w=t>3.3;
  return open_(grad('hg','#0b1640','#03061a'))+stars(t)+moon(900,330,46)+cal+
   `<rect x="70" y="640" width="940" height="560" rx="44" fill="#050a22" opacity=".9" stroke="#D4AF37" stroke-width="4"/>`+
   TX(540,760,64,'#fff','Most people think',800)+TX(540,850,78,'#E3B62F','the weekend is quiet.')+
   TX(540,940,44,'#c9d0ee','Markets close. Nothing happens.',600,cl((t-1.1)/0.4))+zz+
   (w?stamp(t-3.3,'WRONG','#E5323E',1090)+flash(t-3.3):'')+'</svg>'},
 hookPoll(t){
  const q=ease(t/0.5),opts=[['😴','It slept',0],['🛍️','I spent it',0],['📈','It worked',1]];let o='';
  opts.forEach(([e,l,win],i)=>{const a=ease((t-1.3-i*0.35)/0.35),y=1010+i*125,sel=win&&t>3.0,pulse=sel?1+0.03*sin(t*8):1;
   o+=`<g opacity="${a}" transform="translate(${540+(1-a)*300},${y}) scale(${pulse})"><rect x="-380" y="-50" width="760" height="100" rx="50" fill="${sel?'#2fbf71':'rgba(255,255,255,.1)'}" stroke="${sel?'#2fbf71':'rgba(255,255,255,.3)'}" stroke-width="3"/><text x="-320" y="16" font-family="Inter" font-size="46">${e}</text><text x="-250" y="16" font-family="Inter" font-weight="800" font-size="44" fill="#fff">${l}</text>${sel?`<circle cx="320" cy="0" r="30" fill="#fff"/><path d="M304 0 l11 11 l22 -22" stroke="#2fbf71" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:''}</g>`});
  let qs='';for(let i=0;i<6;i++){const x=(i*190+80)%W,y=470+((t*90+i*170)%420);qs+=TX(x,y,90,'#E3B62F','?',900,.12)}
  return open_(grad('hk','#0b1640','#03061a'))+stars(t,40)+qs+
   `<g opacity="${q}" transform="translate(0,${(1-q)*40})">`+TX(540,500,40,'#E3B62F','BE HONEST',800)+TX(540,620,84,'#fff','What did your')+TX(540,720,84,'#fff','money do')+TX(540,820,84,'#E3B62F','last weekend?')+'</g>'+o+
   (t>3.0?flash(t-3.0):'')+'</svg>'},
 weekOld(t){
  const days=['MON','TUE','WED','THU','FRI'];let g='';
  days.forEach((d,i)=>{const a=ease((t-i*0.18)/0.35),x=130+i*205;g+=`<g opacity="${a}" transform="translate(${x},${470+(1-a)*40})"><rect x="-90" y="-60" width="180" height="120" rx="22" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.25)" stroke-width="2"/>${TX(0,-10,34,'#c9d0ee',d,800)}${TX(0,38,30,'#E5323E','WORK',900)}</g>`});
  const desk=`<rect x="300" y="1010" width="480" height="24" rx="8" fill="#3a4a86"/><rect x="330" y="1030" width="16" height="170" fill="#2a3566"/><rect x="734" y="1030" width="16" height="170" fill="#2a3566"/><rect x="610" y="900" width="160" height="104" rx="10" fill="#1a2550" stroke="#8a94b8" stroke-width="5"/><rect x="590" y="1000" width="200" height="12" rx="6" fill="#8a94b8"/><circle cx="690" cy="952" r="${8+3*sin(t*5)}" fill="#E5323E"/>`;
  const sw=t>2.2,k=ease((t-2.2)/0.5);
  const we=sw?`<g transform="translate(540,640) scale(${0.6+0.4*k})" opacity="${k}"><rect x="-330" y="-70" width="660" height="140" rx="70" fill="#E3B62F"/>${TX(0,20,58,'#0b1640','SAT · SUN = YOURS')}</g>`:'';
  return open_(grad('wg','#16306e','#0b1640'))+g+we+desk+P(SAM,{x:540,y:1200,s:1,t,talk:0,sit:1,prop:'laptop',mood:sw?'smile':'neutral',armR:40,elR:60})+
   `<g opacity="${1-cl(k)}">${TX(540,800,46,'#c9d0ee','Monday to Friday: work.',800)}</g>`+'</svg>'},
 partyOld(t){
  let lights='';for(let i=0;i<12;i++){lights+=`<circle cx="${80+i*85}" cy="${470+10*sin(i)}" r="12" fill="${['#E5323E','#E3B62F','#7fe3ff','#b07cff'][i%4]}" opacity="${.5+.5*sin(t*8+i)}"/>`}
  const C=[[MAYA,200],[KAI,400],[LENA,640],[DEV,860]];let ppl='';
  C.forEach(([c,x],i)=>{const j=Math.abs(sin(t*6+i))*40,u=sin(t*6+i)>0;ppl+=P(c,{x,y:1230,s:.85,t,jump:j,armL:u?-155:-125,elL:0,armR:u?-125:-155,elR:0,mood:'smile',talk:.4})});
  const notes=[0,1,2].map(i=>{const k=(t*0.6+i/3)%1;return TX(200+i*330,900-k*300,60,'#E3B62F','♪',900,1-k)}).join('');
  return open_(grad('pg','#2a0f4a','#0b0620'))+beams(t)+lights+`<g transform="translate(540,600) rotate(${t*40})"><circle r="70" fill="#c9d0ee"/>${[0,1,2,3,4,5].map(i=>`<rect x="-12" y="-70" width="24" height="140" fill="#8a94b8" transform="rotate(${i*30})"/>`).join('')}<circle r="70" fill="none" stroke="#fff" stroke-width="4"/></g>`+notes+ppl+tag(t-0.2,'SATURDAY NIGHT',760,'#E5323E')+machine(t,360)+'</svg>'},
 friendsOld(t){
  const by=980-Math.abs(sin(t*4))*260;
  return open_(grad('fg','#7fc6ff','#2a6fb0'))+`<circle cx="880" cy="520" r="70" fill="#ffe27a" opacity=".95"/><rect x="0" y="1100" width="${W}" height="400" fill="#3f9a5a"/>`+
   `<rect x="160" y="1010" width="360" height="22" rx="10" fill="#8a5a3c"/><rect x="330" y="1030" width="22" height="120" fill="#6b4423"/>`+
   P(ZOE,{x:170,y:1190,s:.8,t,sit:1,prop:'coffee',armR:40,elR:90,mood:'smile',talk:.5*Math.abs(sin(t*5))})+P(SAM,{x:510,y:1190,s:.8,t,sit:1,flip:1,prop:'coffee',armR:40,elR:90,mood:'smile'})+
   ballSvg(800,by,34)+P(DEV,{x:800,y:1230,s:.85,t,jump:Math.abs(sin(t*4))*30,armL:-150,armR:-150,elL:0,elR:0,mood:'smile'})+
   tag(t-0.2,'SUNDAY: FRIENDS + PLAY',680,'#E3B62F')+machine(t,360)+'</svg>'},
 homeOld(t){
  let steam='';for(let i=0;i<4;i++){const k=(t*0.7+i/4)%1;steam+=`<path d="M${120+i*24} ${980-k*160} q14 -20 0 -40" stroke="#fff" stroke-width="6" fill="none" opacity="${.6*(1-k)}"/>`}
  const pan=`<rect x="40" y="1020" width="250" height="160" rx="12" fill="#cfd6e6"/><rect x="60" y="1040" width="210" height="10" rx="5" fill="#8a94b8"/><ellipse cx="160" cy="1005" rx="95" ry="24" fill="#2b2b2b"/><rect x="250" y="998" width="100" height="14" rx="7" fill="#2b2b2b"/>`;
  const broom=`<g transform="translate(680,900) rotate(${18*sin(t*4)})"><rect x="-6" y="0" width="12" height="260" fill="#8a5a3c"/><path d="M-50 260 h100 l14 60 h-128 z" fill="#E3B62F"/></g>`;
  const sofa=`<rect x="740" y="1060" width="300" height="110" rx="30" fill="#7a3fb0"/><rect x="740" y="990" width="300" height="90" rx="30" fill="#8e52c4"/>`;
  return open_(grad('hg2','#3a2a1a','#1a120b'))+`<rect x="0" y="1170" width="${W}" height="330" fill="#5a4330"/>`+pan+steam+P(LENA,{x:380,y:1230,s:.8,t,flip:1,armR:70,elR:50,mood:'smile',talk:.3})+broom+P(KAI,{x:590,y:1230,s:.8,t,armR:60,elR:40,armL:50,elL:40,mood:'neutral',lean:4*sin(t*4)})+
   sofa+P(MAYA,{x:890,y:1180,s:.8,t,sit:1,prop:'phone',armR:12,elR:118,mood:'smile'})+TX(950,900,44,'#c9d0ee','z',900,.5+.5*sin(t*3))+
   tag(t-0.2,'COOK · CLEAN · REST',680,'#7fe3ff')+machine(t,360)+'</svg>'},
 clockChart(t){
  const L=[['FRI',150],['SAT',390],['SUN',630],['MON',870]];let ax='';
  L.forEach(([d,x],i)=>{const we=i==1||i==2;ax+=`<rect x="${x-110}" y="560" width="220" height="420" rx="24" fill="${we?'rgba(212,175,55,.12)':'rgba(255,255,255,.05)'}"/>${TX(x,620,40,we?'#E3B62F':'#c9d0ee',d,800)}`});
  const p=ease(t/2.6),x1=150+720*p;let path='M150 860';for(let x=150;x<=x1;x+=12){path+=` L${x} ${860-(x-150)*0.28+22*sin(x/40+t)}`}
  const ex=x1,ey=860-(x1-150)*0.28+22*sin(x1/40+t);
  const ang=t*3;
  return open_(grad('cg','#16306e','#0b1640'))+stars(t,25)+ax+
   `<line x1="150" y1="860" x2="${x1}" y2="860" stroke="rgba(255,255,255,.25)" stroke-dasharray="10 10" stroke-width="3"/>`+
   `<path d="${path}" stroke="#2fbf71" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${ex}" cy="${ey}" r="${16+4*sin(t*8)}" fill="#2fbf71"/>`+
   `<circle cx="150" cy="860" r="16" fill="#E3B62F"/>`+TX(150,930,30,'#E3B62F','Trade opens',800)+
   (p>0.98?TX(870,930,30,'#2fbf71','Closed in profit',800):'')+
   `<g transform="translate(540,1130)"><circle r="78" fill="#050a22" stroke="#D4AF37" stroke-width="6"/><line x1="0" y1="0" x2="${48*sin(ang)}" y2="${-48*cos(ang)}" stroke="#fff" stroke-width="8" stroke-linecap="round"/><line x1="0" y1="0" x2="${34*sin(ang/12)}" y2="${-34*cos(ang/12)}" stroke="#E3B62F" stroke-width="10" stroke-linecap="round"/></g>`+
   TX(540,480,54,'#fff','You live. FTM keeps working.',800)+'</svg>'},
 stats(t){
  const C=[['577','trades held over a weekend',577,0,''],['56%','of them won',56,0,'%'],['1.9×','the average trade result',1.9,1,'×']];let g='';
  C.forEach((c,i)=>{const a=ease((t-0.3-i*0.9)/0.5),y=440+i*275;g+=`<g opacity="${a}" transform="translate(${(1-a)*-120},0)"><rect x="90" y="${y}" width="900" height="235" rx="34" fill="rgba(5,10,34,.75)" stroke="${i==2?'#D4AF37':'rgba(255,255,255,.2)'}" stroke-width="3"/>${TX(540,y+130,112,i==2?'#E3B62F':'#2fbf71',count(cl((t-0.3-i*0.9)/1.0),0,c[2],c[3])+c[4])}${TX(540,y+195,36,'#c9d0ee',c[1],600)}</g>`});
  return open_(grad('sg','#0b1640','#050a22'))+TX(540,370,40,'#E3B62F','PORTFOLIO · 2020 TO 2026 · BACKTEST',800)+g+'</svg>'},
 best(t){
  let pts='';const n=60,p=ease(t/2.2);for(let i=0;i<=n*p;i++){const x=110+i*14,y=620+(i<36?-i*1.5+12*sin(i):(-54+(i-36)*16))+8*sin(i*1.7);pts+=(i?' L':'M')+x+' '+y}

   `<path d="${pts}" stroke="#E5323E" stroke-width="8" fill="none" stroke-linejoin="round"/>`+
   `<g transform="translate(330,820)" opacity="${cl((t-0.4)/0.3)}"><rect x="-180" y="-46" width="360" height="92" rx="46" fill="#E5323E"/>${TX(0,17,46,'#fff','FTM: SHORT')}</g>`+
   `<g transform="translate(540,1150) scale(${1+0.03*sin(t*5)})">${TX(0,40,150,'#2fbf71','+'+v+'%')}</g>`+
   TX(540,1240,38,'#c9d0ee','by Monday morning',600)+'</svg>'},
 live(t){
  const r=150,sx=Math.abs(cos(t*1.6));
  return open_(grad('lg','#0b1640','#03061a'))+stars(t,40)+

let S=[],T=[],TOTAL=0;

};
