<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05091f}
body{font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#fff;position:relative}
#stage{position:absolute;inset:0;overflow:hidden}
.ph{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;will-change:transform}
.shade{position:absolute;inset:0}
.brand{position:absolute;left:0;right:0;top:240px;display:flex;justify-content:center;align-items:center;gap:14px;font-weight:800;font-size:42px;letter-spacing:-.04em;z-index:5;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.mark{width:56px;height:56px;border-radius:16px;background:#1F3A93;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#cap{position:absolute;left:70px;right:70px;top:1330px;text-align:center;background:rgba(5,10,34,.72);backdrop-filter:blur(14px);border:1.5px solid rgba(212,175,55,.4);border-radius:36px;padding:28px 34px;z-index:6;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#cap .w{font-size:52px;line-height:1.22;font-weight:800;letter-spacing:-.02em}
#bar{position:absolute;left:0;top:0;height:6px;background:#D4AF37;z-index:7}
.glass{position:absolute;background:rgba(11,22,64,.62);backdrop-filter:blur(18px);border:1.5px solid rgba(255,255,255,.18);border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
</style></head><body>
<div id="stage"></div>
<div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 10 11l4 4 6-8"/></svg></span>FTM</div>
<div id="bar"></div>
<div id="cap"><div class="w" id="subw"></div></div>
<script src="rig.js"></script><script>
const W=1080,H=1920,sin=Math.sin,cos=Math.cos,PI=Math.PI;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)},back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const IMG=(src,t,o)=>{o=o||{};const z=(o.z0||1)+(o.dz||0.08)*cl(t/(o.d||6)),x=(o.x||0)+(o.dx||0)*cl(t/(o.d||6)),y=(o.y||0)+(o.dy||0)*cl(t/(o.d||6));return `<img class="ph" src="${src}" style="transform:translate(${x}px,${y}px) scale(${z});filter:${o.f||'none'}">`};
const SHADE=(a,b)=>`<div class="shade" style="background:linear-gradient(180deg,rgba(5,9,31,${a}) 0%,rgba(5,9,31,${a*0.35}) 30%,rgba(5,9,31,${a*0.4}) 55%,rgba(5,9,31,${b}) 100%)"></div>`;
const LOGO=(s)=>`<svg viewBox="0 0 120 120" width="${s}" height="${s}"><rect width="120" height="120" rx="35" fill="#1F3A93"/><path d="M30 85 L55 57 L72 73 L96 41" stroke="#D4AF37" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/* 25 Nov 09:30 "Mum's second shift" (POV). ChatGPT photos 2026-11-25-0930-01..06, narrator af_heart, sound lofi.
   Statistic: ILO, women do 76.2% of all unpaid care work (more than three times as much as men). */
window.NOCAP = 1;
const LP = n => '../assets/2026-11-25-0930/2026-11-25-0930-0' + n + '.jpg';
const ph = (n, t, o) => IMG(LP(n), t, Object.assign({ z0: 1.03, dz: .07, d: 7 }, o || {})) + SHADE(.36, .86);
const say = (t, l1, l2, top, c2) => {
  const a = ease((t - .15) / .4), b = ease((t - .55) / .4);
  return `<div style="position:absolute;left:50px;right:50px;top:${top || 1210}px;text-align:center">
    <div style="font-size:76px;font-weight:900;letter-spacing:-.03em;line-height:1.08;white-space:nowrap;opacity:${a};transform:translateY(${(1 - a) * 24}px);text-shadow:0 8px 34px rgba(0,0,0,.75)">${l1}</div>
    ${l2 ? `<div style="font-size:76px;font-weight:900;letter-spacing:-.03em;line-height:1.08;white-space:nowrap;color:${c2 || '#E3B62F'};margin-top:10px;opacity:${b};transform:translateY(${(1 - b) * 24}px);text-shadow:0 8px 34px rgba(0,0,0,.75)">${l2}</div>` : ''}</div>`;
};
const pov = t => `<div style="position:absolute;left:0;right:0;top:360px;text-align:center;opacity:${ease(t / .3)}"><span style="display:inline-block;padding:14px 34px;border-radius:40px;background:rgba(5,10,34,.6);border:2px solid rgba(212,175,55,.7);color:#E3B62F;font-weight:900;font-size:34px;letter-spacing:.18em">POV</span></div>`;
const shift = (t, items) => `<div style="position:absolute;left:40px;right:40px;top:1470px;text-align:center">${items.map((x, i) => { const a = ease((t - .2 - i * .45) / .35); return `<div style="display:inline-block;margin:8px;padding:16px 26px;border-radius:24px;background:rgba(5,10,34,.62);border:1.5px solid rgba(255,255,255,.22);font-size:34px;font-weight:800;opacity:${a};transform:translateY(${(1 - a) * 20}px)"><span style="color:#E3B62F;font-variant-numeric:tabular-nums">${x[0]}</span> · ${x[1]}</div>`; }).join('')}</div>`;
const SCN = {
  hook(t, d) {
    const a = ease(t / .25 + .6), n = (76.2 * Math.min(1, .55 + .45 * ease(t / 1.2))).toFixed(1);
    return ph(3, t, { dz: .08 }) + `<div style="position:absolute;left:0;right:0;top:1060px;text-align:center;opacity:${a}">
      <div style="display:inline-block;padding:12px 30px;border-radius:40px;background:rgba(5,10,34,.6);border:2px solid rgba(212,175,55,.7);color:#E3B62F;font-weight:900;font-size:30px;letter-spacing:.14em">SOURCE · ILO</div>
      <div style="font-size:210px;font-weight:900;letter-spacing:-.05em;line-height:1;margin-top:18px;font-variant-numeric:tabular-nums;text-shadow:0 10px 50px rgba(0,0,0,.6)">${n}%</div>
      <div style="font-size:58px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;text-shadow:0 6px 30px rgba(0,0,0,.8)">of unpaid care work is done by women.</div>
      <div style="font-size:52px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;color:#E3B62F;margin-top:10px;opacity:${ease((t - 1.2) / .4)};text-shadow:0 6px 30px rgba(0,0,0,.8)">More than three times as much as men.</div></div>`;
  },
  pov(t, d) { return ph(1, t, { dz: .09 }) + pov(t) + say(t, 'POV: you’re a mum.', 'Your day has no break.', 1180); },
  shift(t, d) { return ph(2, t, { dx: -20 }) + shift(t, [['06:00', 'school run'], ['09:00', 'laundry'], ['12:00', 'cooking'], ['16:00', 'cleaning']]) + say(t, 'School run. Laundry.', 'Cooking. Again.', 1210); },
  rice(t, d) { return ph(4, t, { dx: 20 }) + say(t, 'The markets kept moving.', 'You kept moving too.'); },
  machine(t, d) { return ph(5, t, { dz: .07 }) + say(t, 'FTM MACHINE trades for you.', 'Fixed rules. 24/7.'); },
  yours(t, d) { return ph(6, t, { dz: .07 }) + say(t, 'Your money stays yours.', 'Pause in one tap.'); },
  cta(t, d) {
    const opt = (k, x, i) => { const a = ease((t - .5 - i * .3) / .4); return `<div style="display:flex;align-items:center;gap:24px;width:900px;margin:0 auto 24px;padding:26px 30px;border-radius:30px;background:rgba(255,255,255,.07);border:2px solid ${k === 'A' ? 'rgba(255,255,255,.25)' : 'rgba(212,175,55,.7)'};opacity:${a};transform:translateX(${(1 - a) * (k === 'A' ? -40 : 40)}px)"><b style="flex:none;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;font-size:56px;background:${k === 'A' ? '#152a7a' : '#D4AF37'};color:${k === 'A' ? '#fff' : '#0b1640'}">${k}</b><span style="font-size:54px;font-weight:800;white-space:nowrap">${x}</span></div>`; };
    return `<div style="position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 45%,#1d3590 0%,#0b1640 55%,#040822 100%)"></div>
      <div style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center">
        <div style="font-size:34px;font-weight:800;letter-spacing:.16em;color:#E3B62F;opacity:${ease(t / .4)}">VOTE IN THE COMMENTS</div>
        <div style="font-size:80px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin:20px 0 46px;opacity:${ease(t / .4)};white-space:nowrap">Mums: when do you get<br>time for money?</div>
        ${opt('A', 'Never', 0)}${opt('B', 'Late at night', 1)}
        <div style="height:40px"></div>
        <div style="display:inline-block;padding:28px 60px;border-radius:70px;background:#E5323E;font-weight:900;font-size:50px;opacity:${ease((t - 1.3) / .4)};transform:scale(${1 + .03 * sin(t * 5)})">Tap the link in our bio</div>
        <div style="margin-top:30px;font-weight:700;font-size:36px;color:#dfe4ff;opacity:${ease((t - 1.7) / .4)}">Create your account · every trade at 6 p.m.</div></div>`;
  }
};

let S=[],T=[],TOTAL=0;
window.setup=function(scenes,durs,amp){if(amp)window.AMP=amp;S=scenes;let a=0.3;T=[];S.forEach((s,i)=>{T.push(a);a+=durs[i]+0.6});TOTAL=a+0.9;window.TOTAL=TOTAL;return {TOTAL,T}};
window.render=function(t){
 document.getElementById('bar').style.width=(t/TOTAL*100)+'%';
 let i=0;for(let k=0;k<S.length;k++)if(t>=T[k]-0.3)i=k;
 const s=S[i],lt=t-T[i],dur=(i+1<S.length?T[i+1]:TOTAL)-T[i];
 const st=document.getElementById('stage');st.innerHTML=SCN[s.id](Math.max(0,lt+0.3),dur,talkAt(s.id,Math.max(0,lt)));
 const fade=Math.min(ease((lt+0.3)/0.3),1-ease((lt-(dur-0.35))/0.3));st.style.opacity=.1+.9*fade;
 const hide=/^hook/.test(s.id)||window.NOCAP;
 const words=s.vo.replace(/^(HER|HIM):\s*/,'').replace(/ftm wealth nation dot com/gi,'ftmwealthnation.com').split(' ');const k=Math.floor(cl(lt/((s.d||dur)*0.95))*words.length+0.999);
 document.getElementById('subw').innerHTML=words.map((w,j)=>`<span style="color:${j<k?(/FTM|MACHINE|markets|free|money|myth|fact|week|trade/i.test(w)?'#E3B62F':'#fff'):'rgba(255,255,255,.28)'}">${w}</span>`).join(' ');
 document.getElementById('cap').style.opacity=hide?0:fade;
};
</script></body></html>
