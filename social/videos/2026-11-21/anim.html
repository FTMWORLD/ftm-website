<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05091f}
body{font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#fff;position:relative}
#stage{position:absolute;inset:0;overflow:hidden}
.ph{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;will-change:transform}
.shade{position:absolute;inset:0}
.brand{position:absolute;left:0;right:0;top:240px;display:flex;justify-content:center;align-items:center;gap:14px;font-weight:800;font-size:42px;letter-spacing:-.04em;z-index:5;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.mark{width:56px;height:56px;border-radius:16px;background:#1F3A93;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#cap{position:absolute;left:70px;right:70px;top:1330px;text-align:center;background:rgba(5,10,34,.72);backdrop-filter:blur(14px);border:1.5px solid rgba(212,175,55,.4);border-radius:36px;padding:28px 34px;z-index:6;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#cap .w{font-size:52px;line-height:1.22;font-weight:800;letter-spacing:-.02em}
#bar{position:absolute;left:0;top:0;height:6px;background:#D4AF37;z-index:7}
.glass{position:absolute;background:rgba(11,22,64,.62);backdrop-filter:blur(18px);border:1.5px solid rgba(255,255,255,.18);border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
</style></head><body>
<div id="stage"></div>
<div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 10 11l4 4 6-8"/></svg></span>FTM</div>
<div id="bar"></div>
<div id="cap"><div class="w" id="subw"></div></div>
<script src="rig.js"></script><script>
const W=1080,H=1920,sin=Math.sin,cos=Math.cos,PI=Math.PI;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)},back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const IMG=(src,t,o)=>{o=o||{};const z=(o.z0||1)+(o.dz||0.08)*cl(t/(o.d||6)),x=(o.x||0)+(o.dx||0)*cl(t/(o.d||6)),y=(o.y||0)+(o.dy||0)*cl(t/(o.d||6));return `<img class="ph" src="${src}" style="transform:translate(${x}px,${y}px) scale(${z});filter:${o.f||'none'}">`};
const SHADE=(a,b)=>`<div class="shade" style="background:linear-gradient(180deg,rgba(5,9,31,${a}) 0%,rgba(5,9,31,${a*0.35}) 30%,rgba(5,9,31,${a*0.4}) 55%,rgba(5,9,31,${b}) 100%)"></div>`;
const LOGO=(s)=>`<svg viewBox="0 0 120 120" width="${s}" height="${s}"><rect width="120" height="120" rx="35" fill="#1F3A93"/><path d="M30 85 L55 57 L72 73 L96 41" stroke="#D4AF37" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/* Nov 21 (v2): "3 myths", every myth acted out with motion. Phase A = the myth (red), phase B = the fact (green). */
const MAYA={skin:'#c68642',hair:'#1b120c',hairStyle:'curly',top:'#7a3fb0',ph:.2};
const SAM={skin:'#f1c27d',hair:'#6b4423',hairStyle:'short',top:'#2a6fb0',beard:1,ph:.9};
const LENA={skin:'#ffdbac',hair:'#b5562b',hairStyle:'long',top:'#d9705a',ph:1.6};
const DEV={skin:'#8d5524',hair:'#141414',hairStyle:'short',top:'#2fa37a',glasses:1,ph:2.1};
const ZOE={skin:'#e0ac69',hair:'#2b1810',hairStyle:'bun',top:'#E3B62F',top2:'#b8901f',ph:.6};
const P=(b,o)=>person(Object.assign({},b,o));
const open_=(bg)=>`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="position:absolute;inset:0">${bg||''}`;
const grad=(id,a,b)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`;
function stampSm(t,label,col){const p=back(t/0.3);return `<g transform="translate(540,420) rotate(-8) scale(${1.8-0.8*p})" opacity="${cl(t/0.12)}"><rect x="-190" y="-62" width="380" height="124" rx="16" fill="rgba(5,10,34,.55)" stroke="${col}" stroke-width="12"/><text x="0" y="34" text-anchor="middle" font-family="Inter" font-weight="900" font-size="96" fill="${col}" letter-spacing="6">${label}</text></g>`}
function banner(t,txt){const p=ease(t/0.45);return `<g transform="translate(${540-(1-p)*900},420)"><rect x="-430" y="-62" width="860" height="124" rx="62" fill="#2fbf71"/><circle cx="-368" cy="0" r="40" fill="#fff"/><path d="M-388 0 l14 14 l26 -28" stroke="#2fbf71" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="17" text-anchor="middle" font-family="Inter" font-weight="900" font-size="44" fill="#fff">${txt}</text></g>`}
function flash(t){return t<0.18?`<rect width="${W}" height="${H}" fill="#fff" opacity="${0.6*(1-t/0.18)}"/>`:''}
function phase(t,d){const sw=d*0.48;return {b:t>=sw,lt:t>=sw?t-sw:t,sw}}
const SCN={
 hook(t){const shake=t>1.7&&t<2.1?sin(t*90)*12:0;let q='';for(let i=0;i<3;i++){const a=ease((t-i*0.25)/0.5);q+=`<text x="${220+i*320}" y="${560+30*sin(t*3+i)}" text-anchor="middle" font-family="Inter" font-weight="900" font-size="${260*a}" fill="#E3B62F" opacity="${.25+.5*a}" transform="rotate(${(1-a)*180+10*sin(t*2+i)} ${220+i*320} 480)">?</text>`}
  let papers='';for(let i=0;i<14;i++){const r=300+i*18,ang=t*(0.8+i*.07)+i;papers+=`<rect x="${540+r*cos(ang)-30}" y="${760+r*0.55*sin(ang)-20}" width="60" height="44" rx="6" fill="#fff" opacity=".18" transform="rotate(${ang*57} ${540+r*cos(ang)} ${760+r*0.55*sin(ang)})"/>`}
  return open_(grad('hg','#0b1640','#03061a'))+`<g transform="translate(${shake},0)">${papers}${q}
  <rect x="70" y="700" width="940" height="480" rx="44" fill="#050a22" opacity=".9" stroke="#D4AF37" stroke-width="4"/>
  <text text-anchor="middle" font-family="Inter" font-weight="800" fill="#fff" font-size="68"><tspan x="540" y="810">Three things people</tspan><tspan x="540" y="895">believe about trading</tspan><tspan x="540" y="980">software…</tspan></text>
  <text x="540" y="1110" text-anchor="middle" font-family="Inter" font-weight="900" font-size="${86*back((t-1.7)/.35)}" fill="#E5323E">All three are wrong.</text></g>${t>1.7?flash(t-1.7):''}</svg>`},
 m1(t,d,talk){const {b,lt}=phase(t,d);
  if(!b){let mons='';for(let i=0;i<6;i++){const x=150+(i%3)*270,y=520+Math.floor(i/3)*190,red=(Math.floor(t*5)+i)%2;let ln='';for(let j=0;j<=12;j++){ln+=(j?'L':'M')+(x+10+j*17)+' '+(y+70+30*sin(j*1.3+t*8+i))}
     mons+=`<rect x="${x}" y="${y}" width="230" height="150" rx="14" fill="#0b0f1f" stroke="#26408a" stroke-width="5"/><path d="${ln}" stroke="${red?'#E5323E':'#2fbf71'}" stroke-width="5" fill="none"/>`}
   let pap='';for(let i=0;i<10;i++){const a=t*2.5+i*0.7,r=200+i*12;pap+=`<rect x="${540+r*cos(a)}" y="${930+90*sin(a)}" width="54" height="40" rx="5" fill="#f3efe8" transform="rotate(${a*80} ${540+r*cos(a)} ${930+90*sin(a)})"/>`}
   const sweat=`<path d="M${590+0} ${640+((t*120)%60)} q8 14 0 22 q-8 -8 0 -22z" fill="#7fc8ff"/>`;
   return open_(grad('og','#16306e','#0b1640'))+`<rect x="0" y="1180" width="${W}" height="740" fill="#0e1b4d"/>${mons}<rect x="200" y="1000" width="680" height="34" rx="10" fill="#6b4423"/>`+P(SAM,{x:540,y:1190,s:1.15,t,talk,mood:'worried',look:sin(t*6),tilt:6*sin(t*7),armL:150,elL:40,armR:150,elR:40})+sweat+pap+stampSm(t-0.2,'MYTH','#E5323E')+'</svg>'}
  const off=(lt*160)%540;let trees='';for(let i=0;i<5;i++){const x=((i*270-off*1.0)%1350+1350)%1350-135;trees+=`<g transform="translate(${x},1060)"><rect x="-14" y="-40" width="28" height="140" fill="#5a3a22"/><circle cx="0" cy="-90" r="${90+10*(i%2)}" fill="${i%2?'#2f8f5b':'#3fa86a'}"/><circle cx="-40" cy="-60" r="60" fill="#2f8f5b"/></g>`}
  let clouds='';for(let i=0;i<3;i++){const x=((i*420-lt*40)%1500+1500)%1500-200;clouds+=`<ellipse cx="${x}" cy="${560+i*60}" rx="130" ry="40" fill="#fff" opacity=".85"/>`}
  return open_(grad('pk','#7fb8ff','#cfe6ff'))+`<circle cx="860" cy="560" r="90" fill="#ffd56b"/>${clouds}<rect x="0" y="1150" width="${W}" height="770" fill="#3d9a5f"/><rect x="0" y="1180" width="${W}" height="60" fill="#c9b48a"/>${trees}`+P(SAM,{x:520,y:1210,s:1.1,t,talk,walk:1,prop:'coffee',armR:10,elR:110,mood:'smile',look:.4})+
   `<g transform="translate(700,880) rotate(${8*sin(t*3)})"><rect x="-60" y="-100" width="120" height="200" rx="18" fill="#0b0f1f"/><rect x="-50" y="-88" width="100" height="176" rx="12" fill="#1F3A93"/><path d="M-30 40 L-8 10 L8 22 L32 -20" stroke="#E3B62F" stroke-width="8" fill="none" stroke-linecap="round"/><text x="0" y="-50" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#2fbf71">● trading</text></g>`+banner(lt,'FTM MACHINE does the work')+flash(lt)+'</svg>'},
 m2(t,d,talk){const {b,lt}=phase(t,d);let coins='';
  if(!b){for(let i=0;i<10;i++){const k=cl((t-0.3-i*0.12)/0.9),x=300+(820-300)*k,y=900-260*sin(PI*k);if(k>0&&k<1)coins+=`<g transform="translate(${x},${y}) rotate(${k*720})"><circle r="26" fill="#E3B62F"/><circle r="18" fill="none" stroke="#b8901f" stroke-width="4"/></g>`}
   return open_(grad('vg','#1a1030','#05030f'))+`<rect x="0" y="1180" width="${W}" height="740" fill="#120a24"/><g transform="translate(830,880)"><rect x="-150" y="-260" width="300" height="420" rx="20" fill="#1d1d24" stroke="#444" stroke-width="8"/><circle cx="0" cy="-60" r="70" fill="#2a2a33" stroke="#555" stroke-width="10"/><text x="0" y="110" text-anchor="middle" font-family="Inter" font-weight="900" font-size="34" fill="#888">SOMEONE ELSE</text></g>`+P(LENA,{x:300,y:1190,s:1.1,t,talk,mood:'surprised',armL:60,elL:60,armR:40,elR:70,lean:-6,look:1})+coins+stampSm(t-0.2,'MYTH','#E5323E')+'</svg>'}
  for(let i=0;i<10;i++){const k=cl((lt-0.2-i*0.1)/0.8),x=820+(500-820)*k,y=860-240*sin(PI*k);if(k>0&&k<1)coins+=`<g transform="translate(${x},${y}) rotate(${-k*720})"><circle r="26" fill="#E3B62F"/><circle r="18" fill="none" stroke="#b8901f" stroke-width="4"/></g>`}
  const door=ease((lt-1.6)/0.4);
  return open_(grad('sg','#16306e','#0b1640'))+`<rect x="0" y="1180" width="${W}" height="740" fill="#0e1b4d"/><g transform="translate(560,860)"><rect x="-190" y="-300" width="380" height="460" rx="26" fill="#E3B62F"/><rect x="-170" y="-280" width="340" height="420" rx="20" fill="#b8901f"/><circle cx="0" cy="-80" r="70" fill="#E3B62F" stroke="#7a5d10" stroke-width="10" transform="rotate(${door*180})"/><rect x="-150" y="70" width="300" height="56" rx="12" fill="#0b1640"/><text x="0" y="108" text-anchor="middle" font-family="Inter" font-weight="900" font-size="32" fill="#fff">YOUR NAME</text></g>`+
   P(LENA,{x:230,y:1190,s:1.05,t,talk,mood:'smile',jump:Math.max(0,40*sin(lt*6))*(lt>1.6?1:0),armL:150,elL:20,armR:150,elR:20,look:1})+coins+banner(lt,'Your money stays in your name')+flash(lt)+'</svg>'},
 m3(t,d,talk){const {b,lt}=phase(t,d);
  if(!b){const mx=-80+t*420;let lines='';for(let i=0;i<8;i++)lines+=`<rect x="${mx-420-i*40}" y="${760+i*40}" width="${120+i*20}" height="8" rx="4" fill="#fff" opacity=".3"/>`;
   return open_(grad('rg2','#2a1030','#0b1640'))+`<rect x="0" y="1150" width="${W}" height="770" fill="#1a1530"/><rect x="0" y="1160" width="${W}" height="14" fill="#666"/>${lines}
    <g transform="translate(${mx},960)"><rect x="-200" y="-200" width="400" height="300" rx="40" fill="#E5323E"/><rect x="-150" y="-160" width="300" height="140" rx="20" fill="#2a0a10"/><text x="0" y="-70" text-anchor="middle" font-family="Inter" font-weight="900" font-size="50" fill="#ffb3b8">AUTO</text><circle cx="-120" cy="120" r="56" fill="#222"/><circle cx="120" cy="120" r="56" fill="#222"/><circle cx="-120" cy="120" r="20" fill="#888" transform="rotate(${t*800} -120 120)"/></g>`+
    P(DEV,{x:Math.max(140,mx-330),y:1190,s:1.0,t,talk,walk:1,walkSpeed:14,lean:10,mood:'worried',armL:120,elL:10,armR:120,elR:10})+stampSm(t-0.2,'MYTH','#E5323E')+'</svg>'}
  const pz=back(lt/0.35);
  return open_(grad('fg','#16306e','#0b1640'))+`<rect x="0" y="1150" width="${W}" height="770" fill="#0e1b4d"/><rect x="0" y="1160" width="${W}" height="14" fill="#666"/>
   <g transform="translate(760,960)" opacity=".85"><rect x="-200" y="-200" width="400" height="300" rx="40" fill="#5b6a9e"/><rect x="-150" y="-160" width="300" height="140" rx="20" fill="#1a2550"/><text x="0" y="-70" text-anchor="middle" font-family="Inter" font-weight="900" font-size="46" fill="#7fe3ff">PAUSED</text><circle cx="-120" cy="120" r="56" fill="#222"/><circle cx="120" cy="120" r="56" fill="#222"/></g>
   <rect width="${W}" height="${H}" fill="#7fe3ff" opacity="${0.12*(1-cl(lt/1.2))}"/>
   <g transform="translate(540,640) scale(${pz})"><circle r="120" fill="#E3B62F"/><rect x="-42" y="-55" width="28" height="110" rx="8" fill="#0b1640"/><rect x="14" y="-55" width="28" height="110" rx="8" fill="#0b1640"/></g>`+
   P(DEV,{x:300,y:1190,s:1.05,t,talk,prop:'phone',armR:12,elR:118,mood:'smile',look:.6})+banner(lt,'Pause any time, one tap')+flash(lt)+'</svg>'},
 cta(t,d,talk){const p=1+.04*sin(t*5);const C=[[MAYA,-1],[SAM,1],[LENA,-1],[DEV,1],[ZOE,-1]];let ppl='';
  C.forEach(([c,dir],i)=>{const tx=180+i*180,sx=dir<0?-200:W+200,k=ease((t-i*0.15)/1.4),x=sx+(tx-sx)*k;ppl+=P(c,{x,y:1200,s:.8,t,walk:k<0.98?1:0,prop:'phone',armR:12,elR:118,mood:'smile',flip:dir>0&&k<.98})});
  let conf='';for(let i=0;i<40;i++){const y=((t*300+i*97)%1300)+200,x=(i*131)%W;conf+=`<rect x="${x}" y="${y}" width="14" height="22" rx="3" fill="${i%3?'#E3B62F':'#fff'}" opacity=".7" transform="rotate(${t*200+i*40} ${x} ${y})"/>`}
  return open_(grad('cg','#1d3590','#0b1640'))+conf+`<g transform="translate(540,620)"><rect x="-430" y="-200" width="860" height="400" rx="40" fill="#050a22" opacity=".9" stroke="#D4AF37" stroke-width="4"/><text x="0" y="-80" text-anchor="middle" font-family="Inter" font-weight="900" font-size="66" fill="#fff">The markets won't wait.</text><g transform="translate(0,70) scale(${p})"><rect x="-230" y="-60" width="460" height="120" rx="60" fill="#E5323E"/><text x="0" y="20" text-anchor="middle" font-family="Inter" font-weight="900" font-size="58" fill="#fff">Start free</text></g></g>`+ppl+'</svg>'}
};

let S=[],T=[],TOTAL=0;
window.setup=function(scenes,durs,amp){if(amp)window.AMP=amp;S=scenes;let a=0.3;T=[];S.forEach((s,i)=>{T.push(a);a+=durs[i]+0.6});TOTAL=a+0.9;window.TOTAL=TOTAL;return {TOTAL,T}};
window.render=function(t){
 document.getElementById('bar').style.width=(t/TOTAL*100)+'%';
 let i=0;for(let k=0;k<S.length;k++)if(t>=T[k]-0.3)i=k;
 const s=S[i],lt=t-T[i],dur=(i+1<S.length?T[i+1]:TOTAL)-T[i];
 const st=document.getElementById('stage');st.innerHTML=SCN[s.id](Math.max(0,lt+0.3),dur,talkAt(s.id,Math.max(0,lt)));
 const fade=Math.min(ease((lt+0.3)/0.3),1-ease((lt-(dur-0.35))/0.3));st.style.opacity=.1+.9*fade;
 const hide=/^hook/.test(s.id);
 const words=s.vo.replace(/ftm wealth nation dot com/gi,'ftmwealthnation.com').split(' ');const k=Math.floor(cl(lt/((s.d||dur)*0.95))*words.length+0.999);
 document.getElementById('subw').innerHTML=words.map((w,j)=>`<span style="color:${j<k?(/FTM|MACHINE|markets|free|money|myth|fact|week|trade/i.test(w)?'#E3B62F':'#fff'):'rgba(255,255,255,.28)'}">${w}</span>`).join(' ');
 document.getElementById('cap').style.opacity=hide?0:fade;
};
</script></body></html>
