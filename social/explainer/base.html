<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#03061a}
body{font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#fff;position:relative}
#bg{position:absolute;inset:0}
#core{position:absolute;inset:0}
#core svg{display:block}
.brand{position:absolute;display:flex;align-items:center;gap:14px;font-weight:800;font-size:44px;letter-spacing:-.04em;z-index:5;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.mark{width:58px;height:58px;border-radius:16px;background:#1F3A93;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#cap{position:absolute;text-align:center;background:rgba(3,6,26,.74);border:1.5px solid rgba(212,175,55,.45);border-radius:34px;z-index:6;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#cap .w{font-weight:800;letter-spacing:-.02em}
#bar{position:absolute;left:0;top:0;height:5px;background:linear-gradient(90deg,#D4AF37,#E3B62F);z-index:7}
#grain{position:absolute;inset:-20px;z-index:4;pointer-events:none;opacity:.045;mix-blend-mode:overlay}
#chapl{position:absolute;right:60px;top:56px;z-index:5;font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#D4AF37;opacity:.85}
body.land{width:1920px;height:1080px}body.land .brand{left:60px;top:50px}
body.land #cap{left:380px;right:380px;bottom:26px;padding:14px 26px}body.land #cap .w{font-size:36px;line-height:1.2}
body.vert{width:1080px;height:1920px}body.vert .brand{left:0;right:0;justify-content:center;top:225px}
body.vert #cap{left:70px;right:70px;top:1440px;padding:28px 34px}body.vert #cap .w{font-size:52px;line-height:1.22}
</style></head><body>
<div id="bg"></div><div id="core"></div>
<div id="chapl"></div><div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 10 11l4 4 6-8"/></svg></span>FTM</div>
<div id="grain"></div><div id="bar"></div><div id="cap"><div class="w" id="subw"></div></div>
<script src="rig.js"></script><script>
(function(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),d=x.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);window.addEventListener('DOMContentLoaded',()=>{document.getElementById('grain').style.background='url('+c.toDataURL()+')'})})();
const LAND=true;document.body.className=LAND?'land':'vert';
const W=1080,H=1080,sin=Math.sin,cos=Math.cos,PI=Math.PI;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)},back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},io=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const VIG=`<defs><radialGradient id='vg' cx='50%' cy='45%' r='75%'><stop offset='.55' stop-color='#000' stop-opacity='0'/><stop offset='1' stop-color='#000' stop-opacity='.55'/></radialGradient></defs><rect x='-700' y='-500' width='2480' height='2600' fill='url(#vg)' pointer-events='none'/>`;
/*__SCENES__*/
let S=[],T=[],TOTAL=0;
window.setup=function(scenes,durs,amp){if(amp)window.AMP=amp;S=scenes;let a=0.2;T=[];S.forEach((s,i)=>{T.push(a);a+=durs[i]+(s.gap||0.45)});TOTAL=a+0.8;window.TOTAL=TOTAL;return {TOTAL,T}};
window.render=function(t){
 document.getElementById('bar').style.width=(t/TOTAL*100)+'%';const gr=document.getElementById('grain');if(gr)gr.style.transform='translate('+((t*977)%20-10)+'px,'+((t*631)%20-10)+'px)';
 let i=0;for(let k=0;k<S.length;k++)if(t>=T[k]-0.25)i=k;
 const s=S[i],lt=t-T[i],dur=(i+1<S.length?T[i+1]:TOTAL)-T[i],tt=Math.max(0,lt+0.25);
 const r=SCN[s.id](tt,dur,talkAt(s.id,Math.max(0,lt)),t,s);document.getElementById('chapl').textContent=s.chap||'';
 document.getElementById('bg').style.background=r.bg;
 const core=document.getElementById('core');core.innerHTML=`<svg width="100%" height="100%" viewBox="${LAND?'-562 -22 2204 1240':'0 -330 1080 1920'}">${r.core}${VIG}</svg>`;
 const fade=Math.min(ease((lt+0.25)/0.25),1-ease((lt-(dur-0.3))/0.25));
 core.style.opacity=.08+.92*fade;core.style.transformOrigin=LAND?'50% 45%':'50% 45%';core.style.transform=`scale(${(r.zoom||1)*(1+0.025*cl(tt/dur))})`;
 const words=(s.vo||'').replace(/ftm wealth nation dot com/gi,'ftmwealthnation.com').replace(/ninety-eight thousand, six hundred and forty-four percent/i,'98,644%').replace(/plus eleven point five six percent/i,'+11.56%').replace(/one thousand euros/i,'1,000€').replace(/plus one point seven percent/i,'+1.70%').replace(/fifteen trades/i,'15 trades').replace(/plus ten point one six percent/i,'+10.16%').replace(/plus two point five five/i,'+2.55%').replace(/plus one point seven\b/i,'+1.70%').replace(/Thirty-one trades/i,'31 trades').replace(/at eleven\./i,'at 11 p.m.').replace(/six red days/i,'6 red days').replace(/five minutes/i,'5 minutes').replace(/plus seventeen hundred percent/i,'+1,772%').replace(/plus twelve thousand/i,'+12,137%').replace(/Twelve, twenty-two and thirty-nine percent/i,'12%, 22% and 39%').replace(/thirty-nine percent/i,'39%').replace(/fifty-three of eighty-two/i,'53 of 82').replace(/Seven out of seven/i,'7 out of 7').replace(/eleven p\.m\./i,'11 p.m.').replace(/Growth two times/gi,'Growth 2×').replace(/fifty languages/i,'50 languages').split(' ');
 // one sentence at a time: the sentence being spoken, its words lit as they are said
 const prog=cl(lt/((s.d||dur)*0.97)), total=words.length; let at=Math.floor(prog*total+0.999), st=0, en=total;
 { let acc=0; for(let j=0;j<total;j++){ if(/[.?!:]$/.test(words[j])&&j<total-1){ if(j+1<=Math.max(0,at-1)) st=j+1; else { en=j+1; break; } } } }
 const words2=words.slice(st,en), k=at-st;
 document.getElementById('subw').innerHTML=words2.map((w,j)=>`<span style="color:${j<k?(/FTM|MACHINE|markets|free|money|trade|\$7\.5|trillion|today/i.test(w)?'#E3B62F':'#fff'):'rgba(255,255,255,.28)'}">${w}</span>`).join(' ');
 document.getElementById('cap').style.opacity=(r.nocap||!s.vo?0:1)*fade;
};
</script></body></html>
