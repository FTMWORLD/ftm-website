name: Watchdog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check every FTM service
        run: |
          code=$(curl -s -o status.json -w '%{http_code}' 'https://www.ftmwealthnation.com/api/v1/status?alert=1')
          cat status.json
          echo
          if [ "$code" != "200" ]; then echo "::error::FTM watchdog found a problem (HTTP $code)"; exit 1; fi
