name: Client area buttons
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
jobs:
  buttons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: npm i --no-save playwright@1.56.1 @simplewebauthn/server@13.3.3 web-push@3.6.7 && (for i in 1 2; do npx playwright install --with-deps chromium && exit 0; echo "browser install with system packages failed, retrying in 30s"; sleep 30; done; echo "Ubuntu package servers unreachable, installing the browser alone"; npx playwright install chromium)
      - name: Click every client-area button
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node .github/tests/buttons.js http://localhost:8765
          node .github/tests/figures.js http://localhost:8765
          node .github/tests/layout.js http://localhost:8765
          node .github/tests/community-api.js
          node .github/tests/fx-api.js
          node .github/tests/scripts-pinned.js
          node .github/tests/no-promises.js
          node .github/tests/email-fallback.js
          node .github/tests/notifications.js http://localhost:8765
          node .github/tests/community-e2e.js http://localhost:8765
          node .github/tests/kyc-e2e.js http://localhost:8765
          node .github/tests/nav-dots-e2e.js http://localhost:8765
          node .github/tests/open-positions.js http://localhost:8765
          node .github/tests/daily-tip.js http://localhost:8765
          node .github/tests/renew.js http://localhost:8765
          node .github/tests/charts-hover.js http://localhost:8765
          node .github/tests/chart-controls.js http://localhost:8765
          node .github/tests/phone-tabs.js http://localhost:8765
          node .github/tests/live-recovery.js http://localhost:8765
          node .github/tests/figures-fit.js http://localhost:8765
          node .github/tests/connect-wait.js http://localhost:8765
          node .github/tests/compact-lists.js http://localhost:8765
          node .github/tests/menu.js http://localhost:8765
          node .github/tests/signup-e2e.js http://localhost:8765
          node .github/tests/passkey-e2e.js
          node .github/tests/onboarding-e2e.js http://localhost:8765
          node .github/tests/perf-idle.js http://localhost:8765
          node .github/tests/legal-pages.js http://localhost:8765
          Z=(Europe/Berlin America/New_York Asia/Kolkata Pacific/Auckland Africa/Lagos Asia/Tokyo); FUZZ_TZ=${Z[$(( $(date +%H) % 6 ))]} node .github/tests/stats-fuzz.js 30 $(( $(date +%j) % 97 + 1 ))
          node .github/tests/stats-fuzz.js 4 5
