name: Live site check
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Wait for the new version to go live
        if: github.event_name == 'push'
        run: sleep 120
      - name: Check the live site (pages, API routes, Stripe buttons, phone layout)
        run: node .github/tests/live.js https://www.ftmwealthnation.com
